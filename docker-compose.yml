name: capstone-factory
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-capstone
    restart: unless-stopped
    ports:
      - "6335:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"

  agent1:
    image: n8nio/n8n:latest
    container_name: agent1-capstone
    restart: unless-stopped
    ports:
      - "5680:5680"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5680
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - qdrant
      - agent2
      - agent3

  agent2:
    build:
      context: ./agent2
      dockerfile: Dockerfile
    container_name: agent2-capstone
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - ./agent2/data:/app/data
    environment:
      PYTHONUNBUFFERED: "1"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    depends_on:
      - qdrant

  agent3:
    build:
      context: ./agent3
      dockerfile: Dockerfile
    container_name: agent3-capstone
    restart: unless-stopped
    ports:
      - "9003:9000"
    volumes:
      - ./agent3/data:/app/data
    environment:
      PYTHONUNBUFFERED: "1"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    depends_on:
      - qdrant

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: ui-capstone
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      NODE_ENV: production
      # Di dalam Docker network, agent diakses lewat nama service, bukan localhost
      AGENT1_URL: http://agent1:5680
      AGENT2_URL: http://agent2:8000
      AGENT3_URL: http://agent3:9000
    depends_on:
      - agent1
      - agent2
      - agent3

volumes:
  qdrant_storage:
  n8n_data:
