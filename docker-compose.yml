services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"

  agent1:
    image: n8nio/n8n:latest
    container_name: agent1
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
      - agent2
      - agent3

  agent2:
    build:
      context: ./agent2
      dockerfile: Dockerfile
    container_name: agent2
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./agent2/data:/app/data
      - ./data_gateway.py:/app/data_gateway.py
    environment:
      PYTHONUNBUFFERED: "1"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
    depends_on:
      - qdrant

  agent3:
    build:
      context: ./agent3
      dockerfile: Dockerfile
    container_name: agent3
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - ./agent3/data:/app/data
      - ./data_gateway.py:/app/data_gateway.py
    environment:
      PYTHONUNBUFFERED: "1"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
    depends_on:
      - qdrant

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      AGENT1_URL: http://agent1:5678
      AGENT2_URL: http://agent2:8000
      AGENT3_URL: http://agent3:9000
    depends_on:
      - agent1
      - agent2
      - agent3

volumes:
  qdrant_storage:
  n8n_data:
